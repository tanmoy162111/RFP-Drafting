name: rfp-drafting
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rfp-drafting-db
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp
      POSTGRES_DB: rfp_drafting
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - rfp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp_drafting"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  rfp_pgdata:
